- hosts: all
  name: Run openstackclient plugin check
  tasks:

    - name: Setup virtualenv, install dependencies, get constraints
      shell:
        cmd: |
          set -e
          echo "------------------------------------------------------------"
          {{ ensure_uv_executable }} venv --python $(which python3) osc_plugins
          echo "------------------------------------------------------------"
          {{ ensure_uv_executable }} pip install --python osc_plugins/bin/python -c ../requirements/upper-constraints.txt -r pyproject.toml --group test
          echo "------------------------------------------------------------"
          cp ../requirements/upper-constraints.txt .
        chdir: /home/zuul/src/opendev.org/openstack/openstackclient

    - name: Remove packages from upper-constraints
      lineinfile:
        dest=/home/zuul/src/opendev.org/openstack/openstackclient/upper-constraints.txt
        state=absent
        regexp='^{{ item.short_name }}.*$'
      with_items: "{{ zuul.projects.values() | list }}"
      when:
        - item.name != "openstack/requirements"
        - item.name != "openstack/openstackclient"

    - name: Install repos that are dependencies
      shell:
        cmd: |
          set -e
          echo "------------------------------------------------------------"
          if grep -F '{{ item.short_name }}' pyproject.toml; then
            {{ ensure_uv_executable }} pip install --python osc_plugins/bin/python -c upper-constraints.txt -e {{ ansible_user_dir }}/{{ item.src_dir }}
          fi
      args:
        chdir: /home/zuul/src/opendev.org/openstack/openstackclient
      with_items: "{{ zuul.projects.values() | list }}"
      when:
        - item.name != "openstack/requirements"
        - item.name != "openstack/openstackclient"

    - name: Run check_osc_commands
      shell:
        cmd: |
          set -e
          echo "------------------------------------------------------------"
          {{ ensure_uv_executable }} pip freeze --python osc_plugins/bin/python
          echo "------------------------------------------------------------"
          osc_plugins/bin/openstack --version
          osc_plugins/bin/python tests/check_osc_commands.py
        chdir: /home/zuul/src/opendev.org/openstack/openstackclient
