[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "openstackclient"
description = "OpenStack Command-line Client"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "Apache-2.0"}
dynamic = ["version"]
requires-python = ">=3.11"
classifiers = [
  "Environment :: OpenStack",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "pbr!=2.1.0,>=2.0.0", # Apache-2.0
    "networkx>=2.3", # BSD
    "aodhclient>=0.9.0", # Apache-2.0
    "gnocchiclient>=3.3.1", # Apache-2.0
    "python-barbicanclient>=4.5.2", # Apache-2.0
    "python-designateclient>=2.7.0", # Apache-2.0
    "python-heatclient>=1.10.0", # Apache-2.0
    "python-ironicclient>=2.3.0", # Apache-2.0
    "python-mistralclient!=3.2.0,>=3.1.0", # Apache-2.0
    "python-neutronclient>=6.7.0", # Apache-2.0
    "python-octaviaclient>=1.3.0", # Apache-2.0
    "python-openstackclient>=4.0.0", # Apache-2.0
    "python-troveclient>=2.2.0", # Apache-2.0
    "python-watcherclient>=1.1.0", # Apache-2.0
    "python-zaqarclient>=1.0.0", # Apache-2.0
    "python-zunclient>=3.4.0", # Apache-2.0
]

[dependency-groups]
test = [
    "oslotest>=3.2.0", # Apache-2.0
    "PyYAML>=6.0.0", # MIT
    "stestr>=2.0.0", # Apache-2.0
]
doc = [
    "sphinx>=2.0.0,!=2.1.0", # BSD
    "openstackdocstheme>=2.2.1", # Apache-2.0
]

[project.urls]
Homepage = "https://docs.openstack.org/python-openstackclient/"
Repository = "https://opendev.org/openstack/openstackclient/"

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["C4", "E", "F", "G", "LOG", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"openstackclient/tests/*" = ["S"]
